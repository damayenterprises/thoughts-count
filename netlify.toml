[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Kick off generation (background function, no timeout ceiling)
[[redirects]]
  from = "/api/generate"
  to = "/.netlify/functions/generate-background"
  status = 200

# Poll for the finished plan
[[redirects]]
  from = "/api/plan"
  to = "/.netlify/functions/plan"
  status = 200

# The advisor mind — a real conversation that decides when it has enough, then hands the
# distilled inputs to /api/generate (TC-82 Phase 1, typed-first)
[[redirects]]
  from = "/api/converse"
  to = "/.netlify/functions/converse"
  status = 200

# Email me my plan (+ opt into date-based email reminders)
[[redirects]]
  from = "/api/send-plan"
  to = "/.netlify/functions/send-plan"
  status = 200

# Google Places photo proxy (keeps the key server-side)
[[redirects]]
  from = "/api/place-photo"
  to = "/.netlify/functions/place-photo"
  status = 200

# Public runtime config (Supabase URL + anon key) for the companion
[[redirects]]
  from = "/api/public-config"
  to = "/.netlify/functions/public-config"
  status = 200

# Anonymous funnel event ingest (no cookies, no personal data)
[[redirects]]
  from = "/api/track"
  to = "/.netlify/functions/track"
  status = 200

# Analytics summary (admin token required)
[[redirects]]
  from = "/api/analytics"
  to = "/.netlify/functions/analytics-summary"
  status = 200

# Plan-quality feedback ingest ("was this helpful?", Loop 2 / TC-58)
[[redirects]]
  from = "/api/feedback"
  to = "/.netlify/functions/feedback"
  status = 200

# Voice transcription — speak your answers during intake (TC-51)
[[redirects]]
  from = "/api/transcribe"
  to = "/.netlify/functions/transcribe"
  status = 200

# Warm spoken readback — reads the confirmation aloud in a human voice (TC-67, opt-in)
[[redirects]]
  from = "/api/speak"
  to = "/.netlify/functions/speak"
  status = 200

# Send the weekly report now (admin token required) — preview / manual re-send
[[redirects]]
  from = "/api/send-digest"
  to = "/.netlify/functions/send-digest"
  status = 200

# --- TC-38 Pro contact import (smart CSV + dedup) ---

# Propose a column mapping (heuristics + small model call for the ambiguous remainder)
[[redirects]]
  from = "/api/import/analyze"
  to = "/.netlify/functions/import-analyze"
  status = 200

# Commit a mapped import inline (small files)
[[redirects]]
  from = "/api/import/commit"
  to = "/.netlify/functions/import-commit"
  status = 200

# Commit a mapped import in the background (large files)
[[redirects]]
  from = "/api/import/commit-background"
  to = "/.netlify/functions/import-commit-background"
  status = 200

# Poll a background import's progress
[[redirects]]
  from = "/api/import/status"
  to = "/.netlify/functions/import-status"
  status = 200

# Resolve one "possible duplicate" (merge / keep both)
[[redirects]]
  from = "/api/review/resolve"
  to = "/.netlify/functions/review-resolve"
  status = 200

# --- TC-49 Relationship memory (facts) writes: create/edit/delete a fact, delete a person ---
[[redirects]]
  from = "/api/memory"
  to = "/.netlify/functions/memory"
  status = 200

# --- TC-50 Capture lifecycle (typed door): extract→resolve→confirm ---

# Take a typed note → extract facts → resolve who → save now (Level A) or hold in To-Review (Level B)
[[redirects]]
  from = "/api/capture/extract"
  to = "/.netlify/functions/capture-extract"
  status = 200

# Confirm / reassign / discard / undo a capture from the To-Review surface
[[redirects]]
  from = "/api/capture/resolve"
  to = "/.netlify/functions/capture-resolve"
  status = 200

# --- TC-89 Voice name catch-&-correct: resolve a bare NAME against the roster (read-only, writes
# nothing) — powers re-check-after-edit on the confirm card + the "say a name" existing-person door.
[[redirects]]
  from = "/api/resolve-name"
  to = "/.netlify/functions/resolve-name"
  status = 200
