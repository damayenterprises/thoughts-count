[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Security headers (applied to every served path). Defense-in-depth for a public app that
# renders user-authored notes and runs third-party marketing pixels. The CSP locks the
# genuinely dangerous directives (object/base/frame-ancestors/form-action) while staying
# permissive where launch-week breakage risk is real: inline scripts (this is a single-file
# inline app), img-src https: (Etsy/Places/pixel images), and — critically — it never blocks
# the microphone (the voice front door). Origins allow-listed: Google Fonts, esm.sh (supabase-js
# / papaparse / xlsx), Supabase (+ realtime wss), and the Meta/GA4/Pinterest pixels.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "microphone=(self), camera=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://connect.facebook.net https://www.googletagmanager.com https://s.pinimg.com https://esm.sh https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob: data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://esm.sh https://*.google-analytics.com https://*.analytics.google.com https://connect.facebook.net https://www.facebook.com https://ct.pinterest.com https://s.pinimg.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# Clean URL for the token-gated live admin dashboard (the page itself shows nothing
# without a valid ANALYTICS_TOKEN; the gate is enforced by /api/analytics).
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# Kick off generation (background function, no timeout ceiling)
[[redirects]]
  from = "/api/generate"
  to = "/.netlify/functions/generate-background"
  status = 200

# Poll for the finished plan
[[redirects]]
  from = "/api/plan"
  to = "/.netlify/functions/plan"
  status = 200

# The advisor mind — a real conversation that decides when it has enough, then hands the
# distilled inputs to /api/generate (TC-82 Phase 1, typed-first)
[[redirects]]
  from = "/api/converse"
  to = "/.netlify/functions/converse"
  status = 200

# Email me my plan (+ opt into date-based email reminders)
[[redirects]]
  from = "/api/send-plan"
  to = "/.netlify/functions/send-plan"
  status = 200

# Contact us / need help — a short message emailed to care@thoughtscount.com (reply-to the sender)
[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200

# Google Places photo proxy (keeps the key server-side)
[[redirects]]
  from = "/api/place-photo"
  to = "/.netlify/functions/place-photo"
  status = 200

# Public runtime config (Supabase URL + anon key) for the companion
[[redirects]]
  from = "/api/public-config"
  to = "/.netlify/functions/public-config"
  status = 200

# Authenticated "am I an admin?" check — the companion UI uses it to decide whether to
# show the in-app Admin dashboard link (the allowlist stays server-side).
[[redirects]]
  from = "/api/whoami"
  to = "/.netlify/functions/whoami"
  status = 200

# TC-138: today's approved daily reflection for the on-site "daily thought"
[[redirects]]
  from = "/api/daily-reflection"
  to = "/.netlify/functions/daily-reflection"
  status = 200

# Anonymous funnel event ingest (no cookies, no personal data)
[[redirects]]
  from = "/api/track"
  to = "/.netlify/functions/track"
  status = 200

# TC-174 Surface 2: low-commitment "daily thought" email opt-in (home bar + guide foot)
[[redirects]]
  from = "/api/subscribe-daily"
  to = "/.netlify/functions/subscribe-daily"
  status = 200

# TC-174 Surface 2: one-tap unsubscribe from the daily thought (linked in every daily email)
[[redirects]]
  from = "/api/daily-unsub"
  to = "/.netlify/functions/daily-unsub"
  status = 200

# Analytics summary (admin token required)
[[redirects]]
  from = "/api/analytics"
  to = "/.netlify/functions/analytics-summary"
  status = 200

# Plan-quality feedback ingest ("was this helpful?", Loop 2 / TC-58)
[[redirects]]
  from = "/api/feedback"
  to = "/.netlify/functions/feedback"
  status = 200

# "Already circled back" bookkeeping (TC-117). Authenticated; idempotent per plan+mechanism.
[[redirects]]
  from = "/api/plan-checkin"
  to = "/.netlify/functions/plan-checkin"
  status = 200

# Voice transcription — speak your answers during intake (TC-51)
[[redirects]]
  from = "/api/transcribe"
  to = "/.netlify/functions/transcribe"
  status = 200

# Warm spoken readback — reads the confirmation aloud in a human voice (TC-67, opt-in)
[[redirects]]
  from = "/api/speak"
  to = "/.netlify/functions/speak"
  status = 200

# Send the weekly report now (admin token required) — preview / manual re-send
[[redirects]]
  from = "/api/send-digest"
  to = "/.netlify/functions/send-digest"
  status = 200

# --- TC-38 Pro contact import (smart CSV + dedup) ---

# Propose a column mapping (heuristics + small model call for the ambiguous remainder)
[[redirects]]
  from = "/api/import/analyze"
  to = "/.netlify/functions/import-analyze"
  status = 200

# Commit a mapped import inline (small files)
[[redirects]]
  from = "/api/import/commit"
  to = "/.netlify/functions/import-commit"
  status = 200

# Commit a mapped import in the background (large files)
[[redirects]]
  from = "/api/import/commit-background"
  to = "/.netlify/functions/import-commit-background"
  status = 200

# Poll a background import's progress
[[redirects]]
  from = "/api/import/status"
  to = "/.netlify/functions/import-status"
  status = 200

# Resolve one "possible duplicate" (merge / keep both)
[[redirects]]
  from = "/api/review/resolve"
  to = "/.netlify/functions/review-resolve"
  status = 200

# --- TC-49 Relationship memory (facts) writes: create/edit/delete a fact, delete a person ---
[[redirects]]
  from = "/api/memory"
  to = "/.netlify/functions/memory"
  status = 200

# --- TC-50 Capture lifecycle (typed door): extract→resolve→confirm ---

# Take a typed note → extract facts → resolve who → save now (Level A) or hold in To-Review (Level B)
[[redirects]]
  from = "/api/capture/extract"
  to = "/.netlify/functions/capture-extract"
  status = 200

# Confirm / reassign / discard / undo a capture from the To-Review surface
[[redirects]]
  from = "/api/capture/resolve"
  to = "/.netlify/functions/capture-resolve"
  status = 200

# TC-98/TC-100 — add a person from a screenshot/photo (multimodal read) OR a shared .vcf. Reads the
# media into the SAME ExtractedPerson shape, then funnels each person through the existing resolve/
# preview/confirm pipeline (writes nothing until the user confirms via /api/capture/resolve).
[[redirects]]
  from = "/api/capture/image"
  to = "/.netlify/functions/capture-image"
  status = 200

# --- TC-89 Voice name catch-&-correct: resolve a bare NAME against the roster (read-only, writes
# nothing) — powers re-check-after-edit on the confirm card + the "say a name" existing-person door.
[[redirects]]
  from = "/api/resolve-name"
  to = "/.netlify/functions/resolve-name"
  status = 200
