<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Nunito:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    position: relative; overflow: hidden;
    font-family: 'Nunito', system-ui, sans-serif;
    background: linear-gradient(135deg, #e6f0ea 0%, #dde9e8 48%, #d7e4ec 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
  }
  /* soft drifting "cloud" blobs, like the site */
  .blob { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .55; }
  .b1 { width: 520px; height: 520px; left: -120px; top: -160px; background: #b3d2ac; }
  .b2 { width: 480px; height: 480px; right: -140px; top: -120px; background: #a9c9d8; opacity: .5; }
  .b3 { width: 440px; height: 440px; right: 60px; bottom: -200px; background: #cbe0c4; opacity: .45; }
  .mark { position: relative; width: 82px; height: 82px; margin-bottom: 26px; }
  .brand {
    position: relative;
    font-family: 'Fraunces', Georgia, serif; font-weight: 600;
    font-size: 74px; color: #34382f; letter-spacing: -.01em; line-height: 1;
  }
  .promise {
    position: relative;
    font-family: 'Fraunces', Georgia, serif; font-style: italic; font-weight: 500;
    font-size: 34px; color: #5f6c4c; margin-top: 26px; max-width: 900px; line-height: 1.3;
  }
  .sub {
    position: relative;
    font-size: 21px; font-weight: 600; color: #7d8a68; margin-top: 30px;
    letter-spacing: .02em;
  }
</style>
</head>
<body>
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
    <path fill="none" stroke="#7d8a68" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M12 20s-7-4.2-7-9.3A4 4 0 0 1 12 8a4 4 0 0 1 7-2.7c1.4 1.9.9 4.4-.6 6.2"/>
    <circle cx="17.5" cy="15.5" r="2.4" fill="none" stroke="#c28a63" stroke-width="1.5"/>
  </svg>
  <div class="brand">Thoughts Count</div>
  <div class="promise">Helping good intentions become meaningful actions.</div>
  <div class="sub">What to say · the gesture that fits · how to keep showing up</div>
</body>
</html>
