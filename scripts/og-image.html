<!doctype html>

     actual generator used to write public/og.png). Blue panel + reversed lockup + tagline. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; }

    position: relative; overflow: hidden;

  .promise {

    font-family: 'Montserrat', sans-serif; font-weight: 500;
    font-size: 26px; color: rgba(255,255,255,.92); margin-top: 26px; max-width: 940px; line-height: 1.3; letter-spacing: .04em;
  }
  .sub {
    position: relative;
    font-size: 22px; font-weight: 500; color: rgba(255,255,255,.82); margin-top: 34px;
    letter-spacing: .38em; text-transform: uppercase;
